services:
  postgres:
    image: postgres
    container_name: seat-management-db
    environment:
      POSTGRES_DB: seatmanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data: